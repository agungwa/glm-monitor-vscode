name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (extension + webview)
        run: npm run build

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-bundle
          path: |
            dist/
            dist-webview/
          retention-days: 7
