name: Release

# Triggered ONLY by pushing a tag like `v0.1.0`. Builds the .vsix and attaches
# it to a GitHub Release for that tag — so any machine can grab the artifact
# without running npm locally.
#
# To cut a release:
#   1. Bump "version" in package.json
#   2. git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build + package
        run: |
          npm run build
          npm run package

      - name: Create / update Release and attach .vsix
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.vsix
